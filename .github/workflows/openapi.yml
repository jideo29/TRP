name: OpenAPI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: [self-hosted, linux, trudi-sandbox]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use runner temp for DOTNET_INSTALL_DIR
        run: echo "DOTNET_INSTALL_DIR=$RUNNER_TEMP/dotnet" >> "$GITHUB_ENV"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test Wayfarer.sln --configuration Release

      - name: Export OpenAPI and fail on drift
        run: ./scripts/export-openapi.sh --check

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Lint OpenAPI with Spectral
        run: npx --yes @stoplight/spectral-cli@6.16.3 lint docs/api/wayfarer-openapi-v1.json --ruleset .spectral.yaml

      # Swagger UI returning 404 in Production is asserted by OpenApiTests.Swagger_ui_returns_404_in_production
      # (a Production host now needs https listeners and Aegis settings, so the old http script was removed).
